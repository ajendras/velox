[package]
name = "velox"
version = "0.1.0"
edition = "2021"
authors = ["Velox Contributors"]
description = "Executes unaltered Xbox Series binaries on Windows via a modular native compatibility layer with pluggable backends and live HTTP monitoring"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/velox"
readme = "README.md"

[lib]
name = "velox"
path = "src/lib.rs"

[[bin]]
name = "velox"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
] }
libloading = "0.8"
anyhow = "1.0"
serde_json = "1.0"
